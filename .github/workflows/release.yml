# v 로 시작하는 태그를 올리면 앱 APK 와 OTA 애드온 패키지를 빌드해서 GitHub 릴리즈로 올린다.
#   1) gradle.properties 의 anall.versionCode / anall.versionName 을 올린다 (앱이 바뀐 경우)
#   2) 바뀐 애드온의 addon.properties versionCode 를 올린다
#   3) git tag v<versionName> && git push origin v<versionName>
# 앱은 최신 릴리즈의 addons-index.json 을 보고 새 애드온은 바로 적용하고, 새 앱 APK 는 설치 화면을 띄운다.
#
# 서명 키는 GitHub Secrets 에 있어야 한다 (scripts/setup-signing.ps1). 없으면 빌드가 실패한다.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check tag matches app version
        run: |
          name=$(grep '^anall.versionName=' gradle.properties | cut -d= -f2 | tr -d '\r')
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 gradle.properties 의 anall.versionName(v$name)이 다릅니다"
            exit 1
          fi

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANALL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANALL_KEYSTORE_BASE64 시크릿이 없습니다. scripts/setup-signing.ps1 을 실행하세요."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANALL_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          ANALL_KEYSTORE_PASSWORD: ${{ secrets.ANALL_KEYSTORE_PASSWORD }}
          ANALL_KEY_ALIAS: ${{ secrets.ANALL_KEY_ALIAS }}
          ANALL_KEY_PASSWORD: ${{ secrets.ANALL_KEY_PASSWORD }}
          ANALL_REQUIRE_RELEASE_KEY: 'true'
        run: ./gradlew --no-daemon test packageRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/ota/* --title "$GITHUB_REF_NAME" --generate-notes

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
