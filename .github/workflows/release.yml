# v 로 시작하는 태그를 올리면 앱 APK 와 OTA 애드온 패키지를 빌드해서 GitHub 릴리즈로 올린다.
#   git tag v0.2.1 && git push origin v0.2.1
# 앱은 최신 릴리즈의 addons-index.json 을 보고 versionCode 가 올라간 애드온만 받아 적용한다.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test and build
        run: ./gradlew --no-daemon test :app:assembleRelease packageAddons

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "build/ota/an-all-tools-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" build/ota/* --title "$GITHUB_REF_NAME" --generate-notes
